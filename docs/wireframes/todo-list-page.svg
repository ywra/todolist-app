<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="760" fill="#f8fafc" rx="8"/>

  <!-- Header -->
  <rect width="960" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="35" font-size="18" font-weight="700" fill="#1e293b">Todo App</text>
  <text x="780" y="35" font-size="13" fill="#475569">홍길동</text>
  <rect x="840" y="16" width="80" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="880" y="36" font-size="12" fill="#64748b" text-anchor="middle">로그아웃</text>

  <!-- Title bar -->
  <text x="40" y="96" font-size="20" font-weight="700" fill="#1e293b">내 할일 목록</text>
  <rect x="780" y="74" width="140" height="38" rx="8" fill="#3b82f6"/>
  <text x="850" y="98" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">+ 새 할일 등록</text>

  <!-- Filter / Sort bar -->
  <rect x="40" y="120" width="880" height="70" rx="8" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Filter tabs -->
  <text x="60" y="148" font-size="12" font-weight="600" fill="#64748b">필터</text>
  <rect x="95" y="132" width="52" height="28" rx="14" fill="#3b82f6"/>
  <text x="121" y="150" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">전체</text>
  <rect x="155" y="132" width="60" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="185" y="150" font-size="11" fill="#64748b" text-anchor="middle">시작전</text>
  <rect x="223" y="132" width="60" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="253" y="150" font-size="11" fill="#64748b" text-anchor="middle">진행중</text>
  <rect x="291" y="132" width="76" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="329" y="150" font-size="11" fill="#64748b" text-anchor="middle">완료 실패</text>
  <rect x="375" y="132" width="76" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="413" y="150" font-size="11" fill="#64748b" text-anchor="middle">성공 완료</text>
  <rect x="459" y="132" width="88" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="503" y="150" font-size="11" fill="#64748b" text-anchor="middle">종료된 할일</text>

  <!-- Sort -->
  <text x="620" y="148" font-size="12" font-weight="600" fill="#64748b">정렬</text>
  <rect x="655" y="132" width="90" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="700" y="150" font-size="11" fill="#475569" text-anchor="middle">시작일 ▼</text>
  <rect x="753" y="132" width="90" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="798" y="150" font-size="11" fill="#475569" text-anchor="middle">오름차순 ▼</text>

  <!-- Table header -->
  <rect x="40" y="206" width="880" height="36" rx="0" fill="#f8fafc"/>
  <text x="70" y="228" font-size="12" font-weight="600" fill="#64748b">완료</text>
  <text x="130" y="228" font-size="12" font-weight="600" fill="#64748b">제목</text>
  <text x="520" y="228" font-size="12" font-weight="600" fill="#64748b">상태</text>
  <text x="660" y="228" font-size="12" font-weight="600" fill="#64748b">시작일</text>
  <text x="770" y="228" font-size="12" font-weight="600" fill="#64748b">종료일</text>
  <text x="880" y="228" font-size="12" font-weight="600" fill="#64748b">관리</text>

  <!-- Row 1 -->
  <rect x="40" y="242" width="880" height="48" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="58" y="256" width="18" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="130" y="271" font-size="13" fill="#1e293b">React 공부하기</text>
  <rect x="510" y="257" width="60" height="22" rx="11" fill="#dbeafe"/>
  <text x="540" y="273" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">진행중</text>
  <text x="660" y="271" font-size="12" fill="#475569">04-01</text>
  <text x="770" y="271" font-size="12" fill="#475569">04-05</text>
  <text x="888" y="271" font-size="16" fill="#94a3b8" text-anchor="middle">⋯</text>

  <!-- Row 2 -->
  <rect x="40" y="290" width="880" height="48" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="58" y="304" width="18" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="130" y="319" font-size="13" fill="#1e293b">보고서 작성</text>
  <rect x="510" y="305" width="60" height="22" rx="11" fill="#e5e7eb"/>
  <text x="540" y="321" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">시작전</text>
  <text x="660" y="319" font-size="12" fill="#475569">04-03</text>
  <text x="770" y="319" font-size="12" fill="#475569">04-07</text>
  <text x="888" y="319" font-size="16" fill="#94a3b8" text-anchor="middle">⋯</text>

  <!-- Row 3 (completed) -->
  <rect x="40" y="338" width="880" height="48" fill="#fafafa" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="58" y="352" width="18" height="18" rx="4" fill="#3b82f6" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="63" y="365" font-size="12" fill="#ffffff" font-weight="700">✓</text>
  <text x="130" y="367" font-size="13" fill="#94a3b8" text-decoration="line-through">디자인 완료</text>
  <rect x="510" y="353" width="76" height="22" rx="11" fill="#dcfce7"/>
  <text x="548" y="369" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">성공 완료</text>
  <text x="660" y="367" font-size="12" fill="#94a3b8">03-25</text>
  <text x="770" y="367" font-size="12" fill="#94a3b8">03-31</text>
  <text x="888" y="367" font-size="16" fill="#94a3b8" text-anchor="middle">⋯</text>

  <!-- Row 4 (overdue) -->
  <rect x="40" y="386" width="880" height="48" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="58" y="400" width="18" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="130" y="415" font-size="13" fill="#1e293b">버그 수정</text>
  <rect x="510" y="401" width="76" height="22" rx="11" fill="#fee2e2"/>
  <text x="548" y="417" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">완료 실패</text>
  <text x="660" y="415" font-size="12" fill="#475569">03-20</text>
  <text x="770" y="415" font-size="12" fill="#475569">03-28</text>
  <text x="888" y="415" font-size="16" fill="#94a3b8" text-anchor="middle">⋯</text>

  <!-- Row 5 -->
  <rect x="40" y="434" width="880" height="48" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="58" y="448" width="18" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="130" y="463" font-size="13" fill="#1e293b">API 문서 작성</text>
  <rect x="510" y="449" width="60" height="22" rx="11" fill="#dbeafe"/>
  <text x="540" y="465" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">진행중</text>
  <text x="660" y="463" font-size="12" fill="#475569">03-28</text>
  <text x="770" y="463" font-size="12" fill="#475569">04-02</text>
  <text x="888" y="463" font-size="16" fill="#94a3b8" text-anchor="middle">⋯</text>

  <!-- More rows indicator -->
  <rect x="40" y="482" width="880" height="32" fill="#f8fafc"/>
  <text x="480" y="503" font-size="12" fill="#94a3b8" text-anchor="middle">⋮</text>

  <!-- Pagination -->
  <rect x="40" y="530" width="880" height="50" rx="0" fill="transparent"/>
  <text x="60" y="560" font-size="12" fill="#64748b">전체 47건 · 20건/페이지</text>

  <rect x="660" y="542" width="32" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="676" y="563" font-size="13" fill="#94a3b8" text-anchor="middle">&lt;</text>

  <rect x="700" y="542" width="32" height="32" rx="6" fill="#3b82f6"/>
  <text x="716" y="563" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="740" y="542" width="32" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="756" y="563" font-size="13" fill="#475569" text-anchor="middle">2</text>

  <rect x="780" y="542" width="32" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="796" y="563" font-size="13" fill="#475569" text-anchor="middle">3</text>

  <rect x="820" y="542" width="32" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="836" y="563" font-size="13" fill="#475569" text-anchor="middle">&gt;</text>

  <!-- Page label -->
  <text x="480" y="710" font-size="11" fill="#94a3b8" text-anchor="middle">TodoListPage — Desktop (768px+)</text>
</svg>
