<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" fill="#f8fafc" rx="8"/>

  <!-- Header -->
  <rect width="960" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="35" font-size="18" font-weight="700" fill="#1e293b">Todo App</text>

  <!-- Login Card -->
  <rect x="280" y="120" width="400" height="420" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="168" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">로그인</text>
  <line x1="320" y1="185" x2="640" y2="185" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Email field -->
  <text x="320" y="218" font-size="13" font-weight="600" fill="#475569">이메일</text>
  <rect x="320" y="226" width="320" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="332" y="251" font-size="13" fill="#94a3b8">이메일을 입력하세요</text>

  <!-- Password field -->
  <text x="320" y="292" font-size="13" font-weight="600" fill="#475569">비밀번호</text>
  <rect x="320" y="300" width="320" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="332" y="325" font-size="13" fill="#94a3b8">비밀번호를 입력하세요</text>

  <!-- Error message area -->
  <rect x="320" y="356" width="320" height="36" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" opacity="0.7"/>
  <text x="336" y="379" font-size="12" fill="#dc2626">⚠ 에러 메시지 영역</text>

  <!-- Login button -->
  <rect x="320" y="408" width="320" height="44" rx="8" fill="#3b82f6"/>
  <text x="480" y="435" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">로그인</text>

  <!-- Register link -->
  <text x="480" y="488" font-size="13" fill="#64748b" text-anchor="middle">계정이 없으신가요?</text>
  <text x="480" y="510" font-size="13" font-weight="600" fill="#3b82f6" text-anchor="middle" text-decoration="underline">회원 가입</text>

  <!-- Page label -->
  <text x="480" y="590" font-size="11" fill="#94a3b8" text-anchor="middle">LoginPage — Desktop (768px+)</text>
</svg>
