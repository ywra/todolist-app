<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="#f8fafc" rx="8"/>

  <!-- Header -->
  <rect width="960" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="35" font-size="18" font-weight="700" fill="#1e293b">Todo App</text>

  <!-- Register Card -->
  <rect x="260" y="100" width="440" height="530" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="148" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">회원 가입</text>
  <line x1="300" y1="165" x2="660" y2="165" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Name field -->
  <text x="300" y="198" font-size="13" font-weight="600" fill="#475569">이름 <tspan fill="#ef4444">*</tspan></text>
  <rect x="300" y="206" width="360" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="312" y="231" font-size="13" fill="#94a3b8">이름을 입력하세요</text>

  <!-- Email field -->
  <text x="300" y="272" font-size="13" font-weight="600" fill="#475569">이메일 <tspan fill="#ef4444">*</tspan></text>
  <rect x="300" y="280" width="360" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="312" y="305" font-size="13" fill="#94a3b8">이메일을 입력하세요</text>

  <!-- Password field -->
  <text x="300" y="346" font-size="13" font-weight="600" fill="#475569">비밀번호 <tspan fill="#ef4444">*</tspan></text>
  <rect x="300" y="354" width="360" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="312" y="379" font-size="13" fill="#94a3b8">비밀번호를 입력하세요</text>
  <text x="300" y="413" font-size="11" fill="#64748b">ℹ 8자 이상, 영문 + 숫자 + 특수문자 각 1자 이상</text>

  <!-- Error message area -->
  <rect x="300" y="430" width="360" height="36" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" opacity="0.7"/>
  <text x="316" y="453" font-size="12" fill="#dc2626">⚠ 에러 메시지 영역</text>

  <!-- Register button -->
  <rect x="300" y="482" width="360" height="44" rx="8" fill="#3b82f6"/>
  <text x="480" y="509" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">가입하기</text>

  <!-- Login link -->
  <text x="480" y="558" font-size="13" fill="#64748b" text-anchor="middle">이미 계정이 있으신가요?</text>
  <text x="480" y="580" font-size="13" font-weight="600" fill="#3b82f6" text-anchor="middle" text-decoration="underline">로그인</text>

  <!-- Page label -->
  <text x="480" y="670" font-size="11" fill="#94a3b8" text-anchor="middle">RegisterPage — Desktop (768px+)</text>
</svg>
